services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cija
      POSTGRES_PASSWORD: cija_dev_only
      POSTGRES_DB: cija
    ports:
      - "127.0.0.1:5433:5432" # 5433 so a locally installed Postgres on 5432 doesn't clash
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cija"]
      interval: 2s
      retries: 20

  mailpit: # catches every outgoing email; web UI on http://localhost:8025
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  dbdata:
